services:
  app:
    build: .
    volumes:
      # Mount source code for hot reloading/editing without rebuilds
      - ./dataset:/app/dataset
      - ./src:/app/src
      - ./models:/app/models
      - ./input_images:/app/input_images
    environment:
      - APP_ENV=development
      - PYTHONUNBUFFERED=1
    ports:
      - "5678:5678"
    # Command to run with debugpy listening
    # --listen 0.0.0.0:5678 allows external connections (from host)
    # --wait-for-client ensures script doesn't run until you attach (optional, remove if unwanted)
    command: python -m debugpy --listen 0.0.0.0:5678 src/main.py train --epochs 30 --patience 30 --batch 16
