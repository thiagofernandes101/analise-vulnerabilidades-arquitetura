services:
  app:
    build: .
    volumes:
      # Mount source code for hot reloading/editing without rebuilds
      - ./dataset:/app/dataset
      - ./src:/app/src
      - ./models:/app/models
      - ./input_images:/app/input_images
    environment:
      - APP_ENV=development
      - PYTHONUNBUFFERED=1
    # Increase shared memory for PyTorch data loaders
    shm_size: '8gb'
    ports:
      - "5678:5678"
    # Command for training with improved accuracy settings (CPU version)
    # Note: Training on CPU is much slower than GPU
    command: python -m debugpy --listen 0.0.0.0:5678 src/main.py train --epochs 50 --patience 15 --batch 4 --imgsz 1280 --workers 4
