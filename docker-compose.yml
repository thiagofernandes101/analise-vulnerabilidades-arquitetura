services:
  app:
    build: .
    ports:
      - "5000:5000"
    volumes:
      # Mount source code for hot reloading during development
      - ./src:/app/src
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Model override — set in your shell or .env file.
      # gemini-2.0-flash-lite  (default) → free tier, separate quota, ~6 600 tests/day
      # gemini-2.0-flash                 → higher accuracy for dense/complex diagrams
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash-lite}
      - FLASK_ENV=development
      - PYTHONUNBUFFERED=1
